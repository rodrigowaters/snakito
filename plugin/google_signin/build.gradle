// Plugin Android v2 do Snakito: Google Sign-In via Credential Manager.
// As dependências são compileOnly — o export plugin as declara como REMOTAS
// e o gradle do JOGO as resolve (mesmo padrão do plugin de Billing).
plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'com.snakito.googlesignin'
    compileSdk 36
    defaultConfig { minSdk 24 }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}
dependencies {
    compileOnly files('libs/godot-lib.aar')
    compileOnly 'androidx.credentials:credentials:1.5.0'
    compileOnly 'androidx.credentials:credentials-play-services-auth:1.5.0'
    compileOnly 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
}
